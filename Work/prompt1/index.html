<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>

        <title>prompts 1 and 2</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #fdfaf5;
            }
            h1{
                color: #2c1e1a;
                border-bottom: 2px solid #b39274;
                padding-bottom: 10px
            }
        </style>

    <body>
        <script>

            const Student = {
                studentName : "Logan Shires",
                studentAge :  25,
                status : "Undergraduate",
                gpa : 3.5 ,

            }

            Student.status = "Graduate" ;
            Student.isEmployed = "False"

            document.write("<h1>" + Student.studentName + "</h1>");
            document.write("<p>" + Student.studentAge + "</p>");
            document.write("<p>" + Student.status + "</p>");
            document.write("<p>" + Student.gpa + "</p>");

            console.log(Student);
            
            Student.program = "Game Design";

            console.log(Student.program);


            const Calculator = {
                add: (n1,n2)=>{
                    return (n1+n2);
                }
                ,sub: (n1,n2)=>{
                    return (n1-n2);
                }
                ,mult: (n1,n2)=>{
                    return (n1*n2);
                }
                ,div: (n1,n2)=>{
                    return (n1/n2);
                }
            }

            console.log(Calculator.add(8,2));
            console.log(Calculator.sub(8,2));
            console.log(Calculator.mult(8,2));
            console.log(Calculator.div(8,2));


        </script>
    </body>
