
<html>
    <head>
    <meta charset="UTF-8"/>
    <meta name="Viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
    <title>Dashboard</title>
</head>
<body>
    <aside>
        <div style="padding: 20px;">
            <h2>DevDash</h2>
            <nav>
                <p>Analytics</p>
                <p>Profile</p>
                <p>Settings</p>
            </nav>
        </div>
    </aside>
    <main>
        <header>
            <h1>Project Overview</h1>
            <p>Welcome back, user. Here is your current system staus</p>
        </header>
        <section class="dashboard-grid">
            <div class="card">
                <h3>Revenue</h3>
                <p style="font-size: 2rem; font-weight: bold;">$12,450</p>
                <span style="color: green;"> up 12% from last month</span>
            </div>
            <div class="card">
                <h3>Active Tasks</h3>
                <p style="font-size: 2rem; font-weight: bold;">24 tasks remaining</p>
                <span style="color: orange;"> Due this week</span>
            </div>
            <div class="card">
                <h3>System Status</h3>
                <p style="font-size: 2rem; font-weight: bold;">99.9%</p>
                <span style="color: blue;"> Uptime</span>
            </div>
        </section>
    </main>
</body>
</html>
